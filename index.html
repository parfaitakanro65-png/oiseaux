
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#65c9f5">
<title>Flappy Bird - Jeu Mobile</title>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #172b46;
    font-family: Arial, Helvetica, sans-serif;
    touch-action: none;
    user-select: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #game-container {
    position: relative;
    width: min(100vw, 56.25vh);
    height: min(100vh, 177.7778vw);
    aspect-ratio: 9 / 16;
    overflow: hidden;
    background: #65c9f5;
    box-shadow: 0 0 35px #0006;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #score {
    position: absolute;
    top: 5%;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: clamp(38px, 11vw, 54px);
    font-weight: 900;
    color: white;
    -webkit-text-stroke: 2px #65412a;
    text-shadow: 2px 4px 0 #65412a;
    pointer-events: none;
    z-index: 2;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    background: #163d5a38;
    z-index: 3;
  }

  #overlay.hidden {
    display: none;
  }

  .panel {
    width: 100%;
    max-width: 310px;
    padding: 25px 18px;
    border: 4px solid #fff;
    border-radius: 24px;
    background: linear-gradient(180deg, #fff9d8, #ffcf70);
    box-shadow: 0 8px 0 #9b652d, 0 14px 28px #17304755;
  }

  h1 {
    font-size: clamp(27px, 8vw, 39px);
    line-height: 1.1;
    color: #e66c23;
    -webkit-text-stroke: 1px #8e461d;
    text-shadow: 2px 3px 0 #fff;
    margin-bottom: 14px;
  }

  #message {
    font-size: 17px;
    line-height: 1.5;
    font-weight: 700;
    color: #68462c;
    white-space: pre-line;
    margin-bottom: 20px;
  }

  #final-score {
    display: none;
    font-size: 23px;
    font-weight: 900;
    color: #17683e;
    margin: 8px 0 18px;
  }

  button {
    width: 100%;
    min-height: 54px;
    border: 3px solid #fff;
    border-radius: 16px;
    background: linear-gradient(180deg, #58d66f, #20a94d);
    box-shadow: 0 5px 0 #167536;
    color: #fff;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    touch-action: manipulation;
  }

  button:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #167536;
  }

  .hint {
    font-size: 12px;
    color: #765638;
    margin-top: 17px;
    font-weight: 700;
  }
</style>
</head>

<body>
<div id="game-container">
  <canvas id="game" width="360" height="640"
          aria-label="Jeu Flappy Bird : touchez l'écran pour faire voler l'oiseau"></canvas>

  <div id="score">0</div>

  <div id="overlay">
    <div class="panel">
      <h1 id="title">FLAPPY BIRD</h1>
      <div id="message">🐤 Fais voler ton oiseau !<br>Évite les tuyaux et bats ton record.</div>
      <div id="final-score"></div>
      <button id="play-button">JOUER !</button>
      <div class="hint">TOUCHE L'ÉCRAN POUR VOLER</div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreElement = document.getElementById("score");
  const overlay = document.getElementById("overlay");
  const titleElement = document.getElementById("title");
  const messageElement = document.getElementById("message");
  const finalScoreElement = document.getElementById("final-score");
  const playButton = document.getElementById("play-button");

  const W = 360;
  const H = 640;
  const GROUND_H = 72;
  const GROUND_Y = H - GROUND_H;

  let state = "ready"; // ready, playing, gameover
  let score = 0;
  let best = 0;
  let frame = 0;
  let lastTime = 0;
  let elapsed = 0;
  let speed = 145;
  let spawnTimer = 0;
  let shake = 0;
  let particles = [];
  let clouds = [];

  const bird = {
    x: 94,
    y: 285,
    radius: 14,
    vy: 0,
    rotation: 0
  };

  let pipes = [];

  function resetGame() {
    score = 0;
    elapsed = 0;
    speed = 145;
    spawnTimer = 0;
    shake = 0;
    frame = 0;
    particles = [];
    pipes = [];

    bird.x = 94;
    bird.y = 285;
    bird.vy = 0;
    bird.rotation = 0;

    scoreElement.textContent = "0";

    for (let i = 0; i < 4; i++) {
      pipes.push({
        x: 410 + i * 225,
        gapY: randomGapY(),
        gap: 160,
        width: 57,
        scored: false
      });
    }
  }

  function randomGapY() {
    return 170 + Math.random() * 255;
  }

  function startGame() {
    resetGame();
    state = "playing";
    overlay.classList.add("hidden");
    flap();
    lastTime = performance.now();
  }

  function flap() {
    if (state === "ready") {
      startGame();
      return;
    }

    if (state !== "playing") return;

    bird.vy = -390;
    burst(bird.x - 9, bird.y + 7, "#fff3a1", 5);
  }

  function gameOver() {
    if (state !== "playing") return;

    state = "gameover";
    shake = 10;
    best = Math.max(best, score);

    burst(bird.x, bird.y, "#ffb344", 24);

    titleElement.textContent = "OUPS !";
    messageElement.textContent = "Le vol est terminé.\nEssaie de faire mieux !";
    finalScoreElement.style.display = "block";
    finalScoreElement.textContent =
      "🏆 Score : " + score + "\n⭐ Record : " + best;
    playButton.textContent = "REJOUER";
    overlay.classList.remove("hidden");
  }

  playButton.addEventListener("click", (event) => {
    event.stopPropagation();
    startGame();
  });

  canvas.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    flap();
  });

  // Le premier toucher sur l'écran de démarrage lance le jeu.
  overlay.addEventListener("pointerdown", (event) => {
    if (event.target === playButton) return;
    if (state === "ready") {
      event.preventDefault();
      startGame();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.code === "Space" || event.code === "ArrowUp") {
      event.preventDefault();

      if (state === "gameover") {
        startGame();
      } else {
        flap();
      }
    }
  });

  function burst(x, y, color, amount) {
    for (let i = 0; i < amount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const force = 40 + Math.random() * 190;

      particles.push({
        x,
        y,
        vx: Math.cos(angle) * force,
        vy: Math.sin(angle) * force,
        life: 0.45 + Math.random() * 0.55,
        maxLife: 0.9,
        size: 2 + Math.random() * 5,
        color
      });
    }
  }

  function updateParticles(dt) {
    particles.forEach(p => {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 250 * dt;
      p.life -= dt;
    });

    particles = particles.filter(p => p.life > 0);
  }

  function update(dt) {
    frame++;

    if (state === "playing") {
      elapsed += dt;

      // Accélération progressive, avec une limite raisonnable.
      speed = Math.min(245, 145 + elapsed * 3.2);

      // Physique du vol.
      bird.vy += 1120 * dt;
      bird.y += bird.vy * dt;
      bird.rotation = Math.max(-0.45, Math.min(1.15, bird.vy / 430));

      // Déplacement des tuyaux.
      pipes.forEach(pipe => {
        pipe.x -= speed * dt;

        if (!pipe.scored && pipe.x + pipe.width < bird.x) {
          pipe.scored = true;
          score++;
          scoreElement.textContent = score;

          // Effet visuel à chaque réussite.
          burst(bird.x + 14, bird.y, "#fff36b", 17);
        }
      });

      pipes = pipes.filter(pipe => pipe.x + pipe.width > -10);

      if (pipes.length === 0 ||
          pipes[pipes.length - 1].x < W - 225) {
        pipes.push({
          x: W + 15,
          gapY: randomGapY(),
          gap: Math.max(132, 160 - elapsed * 0.3),
          width: 57,
          scored: false
        });
      }

      // Collisions avec les bords haut et bas.
      if (bird.y - bird.radius < 0 ||
          bird.y + bird.radius > GROUND_Y) {
        gameOver();
      }

      // Collisions avec les tuyaux.
      for (const pipe of pipes) {
        const withinX =
          bird.x + bird.radius - 3 > pipe.x &&
          bird.x - bird.radius + 3 < pipe.x + pipe.width;

        if (withinX) {
          const gapTop = pipe.gapY - pipe.gap / 2;
          const gapBottom = pipe.gapY + pipe.gap / 2;

          if (bird.y - bird.radius + 3 < gapTop ||
              bird.y + bird.radius - 3 > gapBottom) {
            gameOver();
            break;
          }
        }
      }
    } else if (state === "ready") {
      bird.y = 285 + Math.sin(frame * 0.07) * 9;
      bird.rotation = Math.sin(frame * 0.07) * 0.06;
    }

    updateParticles(dt);

    if (shake > 0) {
      shake = Math.max(0, shake - 30 * dt);
    }
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#55c7f5");
    sky.addColorStop(1, "#c4f1ff");

    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Soleil.
    ctx.fillStyle = "#fff3a5";
    ctx.beginPath();
    ctx.arc(290, 95, 34, 0, Math.PI * 2);
    ctx.fill();

    // Nuages décoratifs animés.
    drawCloud(55 - (frame * 0.18) % 420, 115, 0.8);
    drawCloud(245 - (frame * 0.12) % 420, 205, 1);
    drawCloud(390 - (frame * 0.15) % 450, 65, 0.65);

    // Collines lointaines.
    ctx.fillStyle = "#91db9a";
    ctx.beginPath();
    ctx.moveTo(0, 475);
    ctx.quadraticCurveTo(80, 390, 165, 465);
    ctx.quadraticCurveTo(260, 385, 360, 458);
    ctx.lineTo(360, GROUND_Y);
    ctx.lineTo(0, GROUND_Y);
    ctx.fill();

    ctx.fillStyle = "#66c982";
    ctx.beginPath();
    ctx.moveTo(0, 510);
    ctx.quadraticCurveTo(100, 435, 195, 500);
    ctx.quadraticCurveTo(280, 440, 360, 500);
    ctx.lineTo(360, GROUND_Y);
    ctx.lineTo(0, GROUND_Y);
    ctx.fill();
  }

  function drawCloud(x, y, scale) {
    x = ((x % 460) + 460) % 460 - 55;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.fillStyle = "#ffffffb8";
    ctx.beginPath();
    ctx.arc(0, 10, 17, 0, Math.PI * 2);
    ctx.arc(20, 0, 23, 0, Math.PI * 2);
    ctx.arc(43, 11, 16, 0, Math.PI * 2);
    ctx.rect(0, 10, 43, 17);
    ctx.fill();
    ctx.restore();
  }

  function drawPipe(pipe) {
    const gapTop = pipe.gapY - pipe.gap / 2;
    const gapBottom = pipe.gapY + pipe.gap / 2;
    const x = pipe.x;
    const w = pipe.width;

    const gradient = ctx.createLinearGradient(x, 0, x + w, 0);
    gradient.addColorStop(0, "#13843c");
    gradient.addColorStop(0.22, "#48d65b");
    gradient.addColorStop(0.55, "#20ad48");
    gradient.addColorStop(1, "#08732e");

    ctx.fillStyle = gradient;
    ctx.strokeStyle = "#075e2c";
    ctx.lineWidth = 3;

    // Tuyau supérieur.
    ctx.fillRect(x + 4, 0, w - 8, gapTop - 18);
    ctx.strokeRect(x + 4, -2, w - 8, gapTop - 16);

    ctx.fillRect(x, gapTop - 22, w, 22);
    ctx.strokeRect(x, gapTop - 22, w, 22);

    // Tuyau inférieur.
    ctx.fillRect(x + 4, gapBottom + 18, w - 8,
                 GROUND_Y - gapBottom - 18);
    ctx.strokeRect(x + 4, gapBottom + 18, w - 8,
                   GROUND_Y - gapBottom - 18);

    ctx.fillRect(x, gapBottom, w, 22);
    ctx.strokeRect(x, gapBottom, w, 22);

    // Reflets.
    ctx.fillStyle = "#a4ff9a88";
    ctx.fillRect(x + 9, 0, 5, Math.max(0, gapTop - 23));
    ctx.fillRect(x + 9, gapBottom + 25, 5,
                 Math.max(0, GROUND_Y - gapBottom - 25));
  }

  function drawGround() {
    ctx.fillStyle = "#e8c76a";
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);

    ctx.fillStyle = "#8bd348";
    ctx.fillRect(0, GROUND_Y, W, 13);

    ctx.fillStyle = "#53b93b";
    ctx.fillRect(0, GROUND_Y, W, 5);

    // Motif de sol défilant.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, GROUND_Y + 14, W, GROUND_H - 14);
    ctx.clip();

    ctx.strokeStyle = "#d5a64c";
    ctx.lineWidth = 2;

    const offset = state === "playing"
      ? (frame * speed / 60) % 32
      : 0;

    for (let x = -40 - offset; x < W + 40; x += 32) {
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 14);
      ctx.lineTo(x + 25, H);
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);

    // Queue.
    ctx.fillStyle = "#ff9b35";
    ctx.beginPath();
    ctx.moveTo(-11, 3);
    ctx.lineTo(-22, -3);
    ctx.lineTo(-20, 8);
    ctx.closePath();
    ctx.fill();

    // Corps.
    ctx.fillStyle = "#ffd83d";
    ctx.strokeStyle = "#c87a20";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, 15, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Aile animée.
    const wingLift = state === "playing"
      ? Math.sin(frame * 0.6) * 3
      : Math.sin(frame * 0.12) * 2;

    ctx.fillStyle = "#f6a928";
    ctx.beginPath();
    ctx.ellipse(-5, 4 + wingLift, 8, 5.5, -0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#d78b1b";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Œil.
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(7, -5, 6, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#242c37";
    ctx.beginPath();
    ctx.arc(9, -5, 2.8, 0, Math.PI * 2);
    ctx.fill();

    // Bec.
    ctx.fillStyle = "#ff792e";
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(24, 3);
    ctx.lineTo(12, 7);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "#bd511c";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = Math.min(1, p.life / 0.25);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();

    if (shake > 0) {
      ctx.translate(
        (Math.random() - 0.5) * shake,
        (Math.random() - 0.5) * shake
      );
    }

    drawBackground();

    pipes.forEach(drawPipe);

    drawGround();
    drawBird();
    drawParticles();

    ctx.restore();
  }

  function loop(timestamp) {
    const dt = Math.min((timestamp - (lastTime || timestamp)) / 1000, 0.035);
    lastTime = timestamp;

    update(dt);
    render();

    requestAnimationFrame(loop);
  }

  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
